<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BST Demo</title>
    <style>
        body { margin: 20px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="/index.js"></script>

        var app = Elm.Main.init({
            node: document.getElementById('app')
        });
    </script>
</body>
</html>
